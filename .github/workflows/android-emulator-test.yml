name: Aaria on a simulated phone

# WHY THIS EXISTS
# On 3 Oct 2026 every check on the Aaria wake-word change was green, the founder installed the
# build, and it could not recognise one word. Three faults, none visible to a desk test: the speech
# recogniser was never packed into the app, a downloaded settings file was being overwritten, and
# the wake check had only ever met tidy typed text. They were found by hand, on his phone.
#
# This job boots a real Android system, installs the app, downloads the real speech files with the
# app's own download job, loads the recogniser, plays it recordings of "Hey Aaria" and of ordinary
# sentences, and fails unless it wakes on the first and not on the second.
# The test is android/app/src/androidTest/java/com/pranix/quietkeep/AariaSpeechEngineTest.java.
#
# A phone test by a person is still needed afterwards (microphone, battery, heat, real voices).
# What this ends is asking for one on a build that cannot work.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-emulator-test.yml'

jobs:
  emulator:
    name: Speech engine on a simulated phone
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the speech engine on a simulated phone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          ram-size: 4096M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: cd android && chmod +x gradlew && ./gradlew :app:connectedPersonalDebugAndroidTest --no-daemon --stacktrace

      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aaria-emulator-test-report
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
