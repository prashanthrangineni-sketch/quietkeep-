apply plugin: 'com.android.application'

android {
    namespace "com.pranix.quietkeep"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 9
        versionName "1.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    useLibrary 'android.test.mock'
    flavorDimensions "appType"
    productFlavors {
        personal {
            dimension "appType"
            applicationId "com.pranix.quietkeep"
            resValue "string", "app_name", "QuietKeep Personal"
        }
        business {
            dimension "appType"
            applicationId "com.pranix.quietkeep.business"
            resValue "string", "app_name", "QuietKeep Business"
        }
    }
    signingConfigs {
        release {
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                storeFile file(project.property('RELEASE_STORE_FILE'))
                storePassword project.property('RELEASE_STORE_PASSWORD')
                keyAlias project.property('RELEASE_KEY_ALIAS')
                keyPassword project.property('RELEASE_KEY_PASSWORD')
            }
        }
    }


    buildTypes {
        release {
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // PHONE-TEST BUILD: the downloadable APK made by android-release.yml, the
    // only build signed with the throwaway "quietkeep-testing" key. Play
    // Protect blocks a downloaded APK that asks for notification access, so
    // this build merges src/phonetest/AndroidManifest.xml, which removes the
    // one service that asks for it. Any other build - including anything
    // signed with the real key for Google Play - is untouched.
    def phoneTestBuild = project.hasProperty('RELEASE_KEY_ALIAS') &&
        project.property('RELEASE_KEY_ALIAS') == 'quietkeep-testing'
    if (phoneTestBuild) {
        sourceSets {
            release {
                manifest.srcFile 'src/phonetest/AndroidManifest.xml'
            }
        }
        logger.lifecycle("QuietKeep phone-test build: notification access left out (Play Protect sideload block)")
    }
}

// Checked, not assumed: after the release manifest is merged, read it back. If
// notification access survived, fail the build rather than hand over an APK
// the phone will refuse.
//
// WHICH BUILDS: every DEBUG build (those are only ever installed by download,
// never published), and the RELEASE build only when it carries the throwaway
// testing key. Debug is included for a second reason too: the Android Build
// check on every pull request is a debug build, so this code now runs - and
// must pass - BEFORE a merge, instead of being discovered after one.
afterEvaluate {
    def phoneTest = project.hasProperty('RELEASE_KEY_ALIAS') &&
        project.property('RELEASE_KEY_ALIAS') == 'quietkeep-testing'
    tasks.matching {
        it.name ==~ /process.*DebugMainManifest/ ||
            (phoneTest && it.name ==~ /process.*ReleaseMainManifest/)
    }.all { t ->
        t.doLast {
            // Only this task's own output, not every variant's.
            def merged = fileTree(dir: "${buildDir}/intermediates/merged_manifest",
                                  include: '**/AndroidManifest.xml').files
                .findAll { it.path.contains(t.name) }
            if (merged.isEmpty()) {
                logger.warn("phone-test check: no merged manifest found to verify")
            }
            merged.each { f ->
                // THE OVERLAY ALONE DID NOT DO IT. Build #5/#6 on 1 Oct 2026
                // merged src/phonetest/AndroidManifest.xml and the service was
                // still in the result - the check below caught it and failed
                // the build, as it was written to. So the merged file is now
                // edited directly: the one <service> block is cut out, and the
                // check then proves it is gone. Packaging reads this file next.
                def text = f.text
                if (text.contains('PaymentNotificationListener')) {
                    text = text.replaceAll(/(?s)<service[^>]*?PaymentNotificationListener.*?<\/service>/, '')
                    // The merger keeps XML comments, and the one above this
                    // service names it. Build #7 removed the service and then
                    // failed on that comment. Drop it too.
                    text = text.replaceAll(/<!--[^>]*?PaymentNotificationListener[^>]*?-->/, '')
                    f.text = text
                    logger.lifecycle("phone-test: removed PaymentNotificationListener from ${f.parentFile.name}")
                }
                // What Play Protect actually looks at: the permission that
                // guards a notification listener, and the listener action.
                // Checking for those - not for our class name - means the
                // check fails only on the real thing, and also catches a
                // listener added by any library.
                def offending = f.readLines().findAll {
                    it.contains('BIND_NOTIFICATION_LISTENER_SERVICE') ||
                    it.contains('android.service.notification.NotificationListenerService')
                }
                if (!offending.isEmpty()) {
                    throw new GradleException("phone-test build still asks for notification access in ${f}:\n" +
                        offending.collect { '    ' + it.trim() }.join('\n'))
                }
                logger.lifecycle("phone-test check: no notification access in ${f.name} (${f.parentFile.name}) - verified")
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')

    // ── Push Notifications (FCM) ─────────────────────────────────────────
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-messaging'

    // ── Location (LocationService.java — FusedLocationProviderClient) ────
    // NOT managed by Firebase BOM; must be declared explicitly.
    implementation 'com.google.android.gms:play-services-location:21.2.0'

    // ── Notifications (AlarmReceiver.java — NotificationCompat) ──────────
    // Transitively included via appcompat but pinned explicitly for stability.
    implementation 'androidx.core:core:1.12.0'
    

    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.mockito:mockito-core:5.14.2"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation project(':aaria-edge')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
