ext {
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.1'
    androidxJunitVersion = project.hasProperty('androidxJunitVersion') ? rootProject.ext.androidxJunitVersion : '1.3.0'
    androidxEspressoCoreVersion = project.hasProperty('androidxEspressoCoreVersion') ? rootProject.ext.androidxEspressoCoreVersion : '3.7.0'
}


apply plugin: 'com.android.library'

android {
    namespace = "com.pranix.aariaedge"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 23
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        abortOnError = false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


repositories {
    google()
    mavenCentral()
}


dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    compileOnly fileTree(dir: 'libs', include: ['*.aar'])
    testImplementation fileTree(dir: 'libs', include: ['*.aar'])
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    // No onnxruntime-android here: its native half cannot share libonnxruntime.so with sherpa-onnx's.
    // The speech detector runs on sherpa-onnx's own library (SherpaVadScorer). The JVM copy below is for desk tests only.
    implementation 'androidx.work:work-runtime:2.10.1'
    testImplementation 'com.microsoft.onnxruntime:onnxruntime:1.18.0'
    testImplementation 'org.json:json:20210307'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

import java.security.MessageDigest

task downloadSherpaOnnx {
    def aarUrl = 'https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar'
    def aarFile = file('libs/sherpa-onnx-1.13.8.aar')
    def expectedHash = '633C24321E06B1FE79FEAFA03EA16CBC0F8A286641E2DA3559BAC91BDB13BD96'

    outputs.file(aarFile)
    
    doLast {
        if (!aarFile.exists()) {
            aarFile.parentFile.mkdirs()
            new URL(aarUrl).withInputStream { i -> aarFile.withOutputStream { it << i } }
        }
        
        def digest = MessageDigest.getInstance('SHA-256')
        aarFile.withInputStream { is ->
            byte[] buffer = new byte[8192]
            int read
            while ((read = is.read(buffer)) > 0) {
                digest.update(buffer, 0, read)
            }
        }
        def hash = digest.digest().encodeHex().toString().toUpperCase()
        if (hash != expectedHash) {
            throw new GradleException("SHA-256 mismatch for sherpa-onnx.aar. Expected " + expectedHash + " but got " + hash)
        }
    }
}

preBuild.dependsOn downloadSherpaOnnx

// The second listener's model (sherpa-onnx English keyword spotter, see MODELS.md). Off by default at run time;
// the files are packed into the app so it can be switched on. Downloaded, never committed.
task downloadKeywordSpotter {
    def archiveUrl = 'https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01.tar.bz2'
    def archiveFile = layout.buildDirectory.file("kws/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01.tar.bz2").get().asFile
    def expectedArchiveHash = 'F170013B4716E41B62B9BFD809687C207CEF798EF9BC6534D524E17AF9B6561A'
    def outDir = file('src/main/assets/kws')
    def expectedFiles = [
        'encoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx': '1E721676515BCD42A186979733981213C66C80DB680E1CC582DFEDF3BE76E678',
        'decoder-epoch-12-avg-2-chunk-16-left-64.onnx'     : 'F61EBD3EED3773A44D088D53DFAE92DBB6AEC4839F4DCAEE2D402414741663A3',
        'joiner-epoch-12-avg-2-chunk-16-left-64.int8.onnx' : 'EAE9DA0C7E1E6C6A3F4CC42D167899C388F6C6701B94CB96320E4F55DF79624C',
        'tokens.txt'                                       : 'FD2DED4050A55D2B1578870BA8697D02371980217806B7558BD0A5CC60F3BA53',
    ]

    expectedFiles.keySet().each { outputs.file(new File(outDir, it)) }

    doLast {
        def sha256 = { File f ->
            def digest = MessageDigest.getInstance('SHA-256')
            f.withInputStream { is ->
                byte[] buffer = new byte[8192]
                int read
                while ((read = is.read(buffer)) > 0) {
                    digest.update(buffer, 0, read)
                }
            }
            digest.digest().encodeHex().toString().toUpperCase()
        }
        def allPresent = expectedFiles.every { name, hash ->
            def f = new File(outDir, name)
            f.exists() && sha256(f) == hash
        }
        if (!allPresent) {
            if (!archiveFile.exists()) {
                archiveFile.parentFile.mkdirs()
                new URL(archiveUrl).withInputStream { i -> archiveFile.withOutputStream { it << i } }
            }
            def archiveHash = sha256(archiveFile)
            if (archiveHash != expectedArchiveHash) {
                archiveFile.delete()
                throw new GradleException("SHA-256 mismatch for the keyword spotter archive. Expected " + expectedArchiveHash + " but got " + archiveHash)
            }
            outDir.mkdirs()
            copy {
                from(tarTree(resources.bzip2(archiveFile))) {
                    include expectedFiles.keySet().collect { "*/" + it }
                    eachFile { it.path = it.name }
                    includeEmptyDirs = false
                }
                into outDir
            }
        }
        expectedFiles.each { name, hash ->
            def f = new File(outDir, name)
            if (!f.exists()) throw new GradleException("Keyword spotter file missing after download: " + name)
            def got = sha256(f)
            if (got != hash) {
                throw new GradleException("SHA-256 mismatch for keyword spotter file " + name + ". Expected " + hash + " but got " + got)
            }
        }
    }
}

preBuild.dependsOn downloadKeywordSpotter
