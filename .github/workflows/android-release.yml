name: Android Signed Build

# WHY THIS EXISTS
# android-build.yml produces a DEBUG apk. Android signs those with a throwaway
# key that every developer machine on earth shares, and Google Play Protect
# treats an app carrying it, asking for contacts and a microphone, exactly the
# way it treated ours: "App blocked to protect your device", with no way past.
#
# This builds a RELEASE apk instead, signed with a key generated here, in the
# job, used once and destroyed with the runner. That is a proper release
# signature rather than the shared debug one, which is what Play Protect
# objects to.
#
# WHY NOT THE FOUNDER'S REAL KEY
# Because it is not needed to get a build onto a phone for testing, and a
# signing key is the one thing that proves an app genuinely comes from Pranix.
# It stays where it is. When a build is going to the Play Store, that is the
# moment to use the real key - and that build is uploaded through the Play
# Console, not sideloaded.
#
# WHAT THIS MEANS ON THE PHONE
# The Play Store copy of QuietKeep must be uninstalled first: Android will not
# replace an app with one carrying a different signature. Nothing is lost -
# none of the user's data lives on the device.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-release.yml'

jobs:
  signed:
    name: Build installable release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make a one-off signing key
        # Generated fresh every run and thrown away with the runner. It exists
        # only so the APK carries a release signature instead of the shared
        # Android debug key. It is not, and must never become, the key that
        # signs anything published.
        run: |
          KS="$RUNNER_TEMP/testing.jks"
          keytool -genkeypair -v \
            -keystore "$KS" -storetype JKS \
            -alias quietkeep-testing \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -storepass quietkeep-testing -keypass quietkeep-testing \
            -dname "CN=QuietKeep Testing, OU=Pranix AI Labs, O=Pranix AI Labs, L=Hyderabad, C=IN"
          echo "keystore created, $(stat -c%s "$KS") bytes"

      - name: Build the release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assemblePersonalRelease --no-daemon \
            -PRELEASE_STORE_FILE="$RUNNER_TEMP/testing.jks" \
            -PRELEASE_STORE_PASSWORD=quietkeep-testing \
            -PRELEASE_KEY_ALIAS=quietkeep-testing \
            -PRELEASE_KEY_PASSWORD=quietkeep-testing

      - name: What did it build
        # Checked on presence, not on a guessed path. The first version of the
        # debug workflow failed on exactly that, against a build that had in
        # fact succeeded.
        run: |
          echo "outputs:"
          find android -name '*.apk' -type f -print -exec ls -lh {} \;
          test -n "$(find android -name '*-release.apk' -type f -print -quit)" \
            || { echo "no release APK produced - failing rather than uploading nothing" >&2; exit 1; }

      - name: Is the speech engine really inside the APK
        # Added 3 Oct 2026. Every check was green on a build whose speech recogniser had never been
        # packed. This opens each finished APK and fails unless the recogniser is inside it.
        run: python3 scripts/check_apk_speech_engine.py $(find android -name '*.apk' -type f)

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: quietkeep-installable-apk
          path: android/app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Destroy the key
        if: always()
        run: rm -f "$RUNNER_TEMP/testing.jks"
