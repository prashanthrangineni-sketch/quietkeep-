name: Android Signed Build

# WHY THIS EXISTS
# android-build.yml produces a DEBUG apk. This builds a RELEASE apk instead,
# signed with a key generated here, in the job, used once and destroyed with
# the runner - the file the founder downloads onto a phone for testing.
#
# WHY THE PHONE-TEST APK LEAVES OUT NOTIFICATION ACCESS AND SMS PERMISSIONS
# This file used to say the shared DEBUG signature was why Google Play Protect
# said "App blocked to protect your device". That was wrong. On 16 Oct 2026 an
# APK from this workflow, properly signed, was blocked just the same: "This app
# can request access to sensitive data". That is Play Protect's enhanced fraud
# protection, live in India. It blocks an app installed from a browser,
# messaging app or file manager that asks for an SMS permission, a
# notification listener (BIND_NOTIFICATION_LISTENER_SERVICE) or an
# accessibility service (BIND_ACCESSIBILITY_SERVICE). The signature does not
# matter; the permission does.
#
# QuietKeep asks for two of those: PaymentNotificationListener (UPI expense
# auto-capture) and SEND_SMS (the automatic SOS text, added 13-14 Oct). The
# 16 Oct file most likely already lacked the listener (android/app/build.gradle
# was removing it), so SEND_SMS is the leading suspect. Before building,
# scripts/android/phone-test-manifest.py cuts both out of the manifest ON THIS
# RUNNER'S CHECKOUT ONLY. The repository's manifest, and so the Play Store
# build, keeps them. After the build, the finished APK is opened and the job
# fails if any SMS permission, a notification listener or an accessibility
# service is still inside, or if anything else the repository declares is
# missing. What this test APK cannot do: UPI expense auto-capture, and sending
# the SOS text by itself (it opens the SMS app with the text ready instead).
#
# WHY NOT THE FOUNDER'S REAL KEY
# Because it is not needed to get a build onto a phone for testing, and a
# signing key is the one thing that proves an app genuinely comes from Pranix.
# It stays where it is. When a build is going to the Play Store, that is the
# moment to use the real key - and that build is uploaded through the Play
# Console, not sideloaded.
#
# WHAT THIS MEANS ON THE PHONE
# The Play Store copy of QuietKeep must be uninstalled first: Android will not
# replace an app with one carrying a different signature. Nothing is lost -
# none of the user's data lives on the device.

on:
  workflow_dispatch:
  # Runs on a pull request that changes this file or the manifest script, so
  # the result is visible before merge.
  pull_request:
    paths:
      - '.github/workflows/android-release.yml'
      - 'scripts/android/phone-test-manifest.py'
      - 'scripts/android/check_apk_components.py'
      # A change here could stop the listener being found - fail before merge.
      - 'android/app/src/main/AndroidManifest.xml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-release.yml'
      - 'scripts/android/**'

jobs:
  signed:
    name: Build installable release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Leave notification access and SMS permissions out of the phone-test manifest
        # Edits the manifest on this runner's checkout only - never committed.
        # Fails if the PaymentNotificationListener block is not found, or if
        # any SMS permission is left, rather than building an APK the phone
        # would refuse.
        run: python3 scripts/android/phone-test-manifest.py android/app/src/main/AndroidManifest.xml

      - name: Make a one-off signing key
        # Generated fresh every run and thrown away with the runner. It exists
        # only so the APK carries a release signature instead of the shared
        # Android debug key. It is not, and must never become, the key that
        # signs anything published.
        run: |
          KS="$RUNNER_TEMP/testing.jks"
          keytool -genkeypair -v \
            -keystore "$KS" -storetype JKS \
            -alias quietkeep-testing \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -storepass quietkeep-testing -keypass quietkeep-testing \
            -dname "CN=QuietKeep Testing, OU=Pranix AI Labs, O=Pranix AI Labs, L=Hyderabad, C=IN"
          echo "keystore created, $(stat -c%s "$KS") bytes"

      - name: Build the release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assemblePersonalRelease --no-daemon \
            -PRELEASE_STORE_FILE="$RUNNER_TEMP/testing.jks" \
            -PRELEASE_STORE_PASSWORD=quietkeep-testing \
            -PRELEASE_KEY_ALIAS=quietkeep-testing \
            -PRELEASE_KEY_PASSWORD=quietkeep-testing

      - name: What did it build
        # Checked on presence, not on a guessed path. The first version of the
        # debug workflow failed on exactly that, against a build that had in
        # fact succeeded.
        run: |
          echo "outputs:"
          find android -name '*.apk' -type f -print -exec ls -lh {} \;
          test -n "$(find android -name '*-release.apk' -type f -print -quit)" \
            || { echo "no release APK produced - failing rather than uploading nothing" >&2; exit 1; }

      - name: Does the APK ask for anything Play Protect blocks downloads for
        # Reads the manifest out of the finished APK itself, not out of the
        # source, and fails if any of the four permissions Play Protect blocks
        # a downloaded app for is still there. Prints the APK's full
        # permission list either way.
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT="$SDK/build-tools/$(ls "$SDK/build-tools" | sort -V | tail -1)"
          AAPT2="$BT/aapt2"
          test -x "$AAPT2" || { echo "aapt2 not found under $SDK/build-tools" >&2; exit 1; }
          echo "using $AAPT2"
          APKS=$(find android -name '*-release.apk' -type f)
          test -n "$APKS" || { echo "no release APK to check" >&2; exit 1; }
          bad=0
          for apk in $APKS; do
            echo "== $apk"
            echo "-- permissions in the APK:"
            "$AAPT2" dump permissions "$apk"
            TREE="$RUNNER_TEMP/apk-manifest.txt"
            "$AAPT2" dump xmltree --file AndroidManifest.xml "$apk" > "$TREE"
            test -s "$TREE" || { echo "could not read the APK's manifest" >&2; exit 1; }
            # Proves the search below can see a permission at all: INTERNET is
            # always asked for. If this fails, the check is blind, not clean.
            grep -qF '"android.permission.INTERNET"' "$TREE" \
              || { echo "could not find INTERNET in the APK manifest dump - check is blind" >&2; exit 1; }
            # Any SMS / MMS / WAP-push permission: SEND_SMS, READ_SMS, RECEIVE_SMS,
            # RECEIVE_MMS, RECEIVE_WAP_PUSH and any other of that family.
            if grep -E '"android\.permission\.[A-Z_]*(SMS|MMS|WAP_PUSH)[A-Z_]*"' "$TREE"; then
              echo "FAIL: $apk asks for an SMS permission - Play Protect would block this download" >&2
              bad=1
            fi
            for name in \
              android.permission.BIND_NOTIFICATION_LISTENER_SERVICE \
              android.permission.BIND_ACCESSIBILITY_SERVICE \
              android.service.notification.NotificationListenerService \
              android.accessibilityservice.AccessibilityService; do
              if grep -F "\"$name\"" "$TREE"; then
                echo "FAIL: $apk contains $name - Play Protect would block this download" >&2
                bad=1
              fi
            done
            # Nothing else may be lost: every component and permission the
            # repository's own manifest declares (as committed, not as edited
            # on this runner) must still be inside, except the listener.
            git show HEAD:android/app/src/main/AndroidManifest.xml > "$RUNNER_TEMP/repo-manifest.xml"
            python3 scripts/android/check_apk_components.py "$RUNNER_TEMP/repo-manifest.xml" "$TREE" || bad=1
          done
          test "$bad" = 0 || exit 1
          echo "ok: no SMS/MMS/WAP-push permission (SEND_SMS, READ_SMS, RECEIVE_SMS ...), no BIND_NOTIFICATION_LISTENER_SERVICE, no BIND_ACCESSIBILITY_SERVICE in the APK"

      - name: Is the speech engine really inside the APK
        # Added 3 Oct 2026. Every check was green on a build whose speech recogniser had never been
        # packed. This opens each finished APK and fails unless the recogniser is inside it.
        run: python3 scripts/check_apk_speech_engine.py $(find android -name '*.apk' -type f)

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: quietkeep-installable-apk
          path: android/app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Destroy the key
        if: always()
        run: rm -f "$RUNNER_TEMP/testing.jks"
