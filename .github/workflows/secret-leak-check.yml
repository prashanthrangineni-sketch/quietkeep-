name: secret-leak-check
# T-01 (Master SOT): fail any PR/push that contains a credential.
# Runs the free gitleaks binary directly - the hosted gitleaks-action requires a paid licence for
# organisation repos and was failing after 6 s for that reason.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * 1"   # weekly full-history scan, Monday 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Write gitleaks config
        run: |
          cat > .gitleaks.toml <<'EOF'
          [extend]
          useDefault = true
          [[rules]]
          id = "sarvam-api-key"
          description = "Sarvam API Key"
          regex = '''(?i)(sarvam|saaras|bulbul).{0,20}['"]([a-zA-Z0-9_-]{32,64})['"]'''
          [[rules]]
          id = "supabase-service-role-key"
          description = "Supabase Service Role Key"
          regex = '''(?i)supabase.{0,30}service.{0,20}['"](eyJ[a-zA-Z0-9_-]+\.[a-zA-Z0-9_-]+\.[a-zA-Z0-9_-]+)['"]'''
          [[rules]]
          id = "doppler-service-token"
          description = "Doppler service token"
          regex = '''dp\.st\.[a-z0-9_]+\.[A-Za-z0-9]{20,}'''
          [[rules]]
          id = "pranix-mcp-bearer"
          description = "Pranix MCP bearer token"
          regex = '''pmcp_[A-Za-z0-9_-]{16,}'''
          [[rules]]
          id = "nvidia-nim-key"
          description = "NVIDIA NIM API key"
          regex = '''nvapi-[A-Za-z0-9_-]{20,}'''
          [[rules]]
          id = "groq-key"
          description = "Groq API key"
          regex = '''gsk_[A-Za-z0-9]{20,}'''
          [[rules]]
          id = "twilio-sid"
          description = "Twilio SID"
          regex = '''AC[a-f0-9]{32}'''
          [[rules]]
          id = "github-fine-grained-pat"
          description = "GitHub fine-grained PAT"
          regex = '''github_pat_[A-Za-z0-9_]{20,}'''
          EOF
      - name: Install gitleaks
        run: |
          set -e
          VER=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o /tmp/gl.tgz
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan (PR/push = commits in range; schedule/manual = full history)
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
            gitleaks git --config .gitleaks.toml --redact --exit-code 1 --log-opts="$RANGE" .
          elif [ "${{ github.event_name }}" = "push" ]; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
            gitleaks git --config .gitleaks.toml --redact --exit-code 1 --log-opts="$RANGE" .
          else
            gitleaks git --config .gitleaks.toml --redact --exit-code 1 .
          fi
