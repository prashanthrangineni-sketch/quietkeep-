apply plugin: 'com.android.application'

android {
    namespace "com.pranix.quietkeep"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 9
        versionName "1.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    flavorDimensions "appType"
    productFlavors {
        personal {
            dimension "appType"
            applicationId "com.pranix.quietkeep"
            resValue "string", "app_name", "QuietKeep Personal"
        }
        business {
            dimension "appType"
            applicationId "com.pranix.quietkeep.business"
            resValue "string", "app_name", "QuietKeep Business"
        }
    }
    signingConfigs {
        release {
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                storeFile file(project.property('RELEASE_STORE_FILE'))
                storePassword project.property('RELEASE_STORE_PASSWORD')
                keyAlias project.property('RELEASE_KEY_ALIAS')
                keyPassword project.property('RELEASE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // PHONE-TEST BUILD: the downloadable APK made by android-release.yml, the
    // only build signed with the throwaway "quietkeep-testing" key. Play
    // Protect blocks a downloaded APK that asks for notification access, so
    // this build merges src/phonetest/AndroidManifest.xml, which removes the
    // one service that asks for it. Any other build - including anything
    // signed with the real key for Google Play - is untouched.
    def phoneTestBuild = project.hasProperty('RELEASE_KEY_ALIAS') &&
        project.property('RELEASE_KEY_ALIAS') == 'quietkeep-testing'
    if (phoneTestBuild) {
        sourceSets {
            release {
                manifest.srcFile 'src/phonetest/AndroidManifest.xml'
            }
        }
        logger.lifecycle("QuietKeep phone-test build: notification access left out (Play Protect sideload block)")
    }
}

// Checked, not assumed: after the release manifest is merged, read it back. If
// notification access survived, fail the build rather than hand over an APK
// the phone will refuse.
afterEvaluate {
    def phoneTest = project.hasProperty('RELEASE_KEY_ALIAS') &&
        project.property('RELEASE_KEY_ALIAS') == 'quietkeep-testing'
    if (!phoneTest) return
    tasks.matching { it.name ==~ /process.*ReleaseMainManifest/ }.all { t ->
        t.doLast {
            def merged = fileTree(dir: "${buildDir}/intermediates/merged_manifest",
                                  include: '**/AndroidManifest.xml').files
            if (merged.isEmpty()) {
                logger.warn("phone-test check: no merged manifest found to verify")
            }
            merged.each { f ->
                // THE OVERLAY ALONE DID NOT DO IT. Build #5/#6 on 1 Oct 2026
                // merged src/phonetest/AndroidManifest.xml and the service was
                // still in the result - the check below caught it and failed
                // the build, as it was written to. So the merged file is now
                // edited directly: the one <service> block is cut out, and the
                // check then proves it is gone. Packaging reads this file next.
                def text = f.text
                if (text.contains('PaymentNotificationListener')) {
                    f.text = text.replaceAll(/(?s)<service[^>]*?PaymentNotificationListener.*?<\/service>/, '')
                    logger.lifecycle("phone-test: removed PaymentNotificationListener from ${f.parentFile.name}")
                }
                if (f.text.contains('PaymentNotificationListener') ||
                        f.text.contains('BIND_NOTIFICATION_LISTENER_SERVICE')) {
                    throw new GradleException("phone-test build still asks for notification access: ${f}")
                }
                logger.lifecycle("phone-test check: no notification access in ${f.name} (${f.parentFile.name}) - verified")
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')

    // ── Push Notifications (FCM) ─────────────────────────────────────────
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-messaging'

    // ── Location (LocationService.java — FusedLocationProviderClient) ────
    // NOT managed by Firebase BOM; must be declared explicitly.
    implementation 'com.google.android.gms:play-services-location:21.2.0'

    // ── Notifications (AlarmReceiver.java — NotificationCompat) ──────────
    // Transitively included via appcompat but pinned explicitly for stability.
    implementation 'androidx.core:core:1.12.0'
    

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
