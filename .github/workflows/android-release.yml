name: Android Signed Build

# WHY A SECOND WORKFLOW
# android-build.yml produces a DEBUG apk. Android signs those with a throwaway
# key that every developer machine shares, and Google Play Protect treats an
# app carrying it, asking for contacts and a microphone, exactly the way it
# treated ours: blocked, with no "install anyway".
#
# A release-signed build carries the founder's own key. It is the same artifact
# that goes to the Play Console, it installs without the block, and it is what
# an internal-testing track needs. This is the route that stops us fighting the
# phone every time.
#
# SECRETS. This workflow reads four, and never prints them. The keystore is
# written to the runner, used, and destroyed with the runner. Nobody but the
# founder ever handles the key itself.
#
#   ANDROID_KEYSTORE_BASE64   the .jks file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# Run by hand only. A signing key should not be exercised on every push.

on:
  workflow_dispatch:

jobs:
  signed:
    name: Build signed release APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Check the signing secrets are present
        # Checks presence, never value. Failing here with a readable message
        # beats an unsigned build that looks like it worked.
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KS"    ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$KSP"   ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KP"    ] || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "missing repository secrets:$missing" >&2
            exit 1
          fi
          echo "all four signing secrets are present"

      - name: Write the keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks" \
            || { echo "the decoded keystore is empty - check the base64 is the whole file" >&2; exit 1; }
          echo "keystore written, $(stat -c%s "$RUNNER_TEMP/release.jks") bytes"

      - name: Build signed release
        env:
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          # Passed as properties, read from the environment, so no secret is
          # ever written into a command line that a log could capture.
          ./gradlew assemblePersonalRelease bundlePersonalRelease --no-daemon \
            -PRELEASE_STORE_FILE="$RUNNER_TEMP/release.jks" \
            -PRELEASE_STORE_PASSWORD="$KSP" \
            -PRELEASE_KEY_ALIAS="$ALIAS" \
            -PRELEASE_KEY_PASSWORD="$KP"

      - name: What did it build
        run: |
          echo "signed outputs:"
          find android -name '*.apk' -o -name '*.aab' | while read -r f; do ls -lh "$f"; done
          test -n "$(find android -name '*-release.apk' -type f -print -quit)" \
            || { echo "no release APK produced - failing rather than uploading nothing" >&2; exit 1; }

      - name: Keep them
        uses: actions/upload-artifact@v4
        with:
          name: quietkeep-signed-release
          path: |
            android/app/build/outputs/apk/**/release/*.apk
            android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Destroy the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
