name: Android Build

# WHY THIS UPLOADS THE APK
# It did not, for the whole life of this file. The job compiled a working
# debug APK on every push that touched android/, and then the runner was
# destroyed and the file with it. It was named "Build Verification" and that
# is exactly all it did: prove the code compiles, to nobody's benefit.
#
# The cost was not theoretical. The app on the founder's phone is the 22
# August bundle. Three things reported for days - reminders that speak and
# dial with the screen locked, the back button exiting the app, and the Telugu
# reminder voice - are native code that has been in this repository, building
# green, and going in the bin on every run.
#
# WHY THE PATH IS A WILDCARD
# The first version of this file looked for one APK at
# app/build/outputs/apk/debug/app-debug.apk. This project has two product
# flavours, so Gradle writes app/build/outputs/apk/personal/debug/ and
# app/build/outputs/apk/business/debug/ instead, and the check failed on a
# build that had in fact succeeded. Matching the tree rather than one guessed
# filename means adding or renaming a flavour cannot break this again.
#
# WHY workflow_dispatch
# The triggers below only fire when android/ or package.json changes. Most of
# what now needs to reach the phone is Java that merged weeks ago, so there is
# nothing left to change to make a build happen. It has to be startable by hand.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
      - 'package.json'

jobs:
  android-build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: What did it build
        # Listed on purpose, and checked on presence rather than on a path.
        # A silently-missing file is exactly how the upload below would come to
        # "succeed" while uploading nothing - which is the defect this whole
        # file exists to end.
        run: |
          echo "APKs produced:"
          find android -name '*.apk' -type f -print -exec ls -lh {} \;
          test -n "$(find android -name '*.apk' -type f -print -quit)" \
            || { echo "the build reported success and produced no APK - failing rather than uploading nothing" >&2; exit 1; }

      - name: Keep the APKs
        uses: actions/upload-artifact@v4
        with:
          name: quietkeep-debug-apk
          # Both flavours. app-personal-debug.apk is QuietKeep Personal.
          path: android/app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
          retention-days: 30
